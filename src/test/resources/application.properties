spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.expiration=30000
jwt.secret=SuperSecretForTestsOnlyButAlsoItNeedsToBeLonger

dropbox.app-name=task-management-spring-app
dropbox.access-token=${DROPBOX_ACCESS_TOKEN:}
dropbox.refresh-token=${DROPBOX_REFRESH_TOKEN:}
dropbox.client-id=${DROPBOX_CLIENT_ID:}
dropbox.client-secret=${DROPBOX_CLIENT_SECRET:}
