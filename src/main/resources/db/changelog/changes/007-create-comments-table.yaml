databaseChangeLog:
  - changeSet:
      id: 007-create-comments-table
      author: Ivan
      changes:
        - createTable:
            tableName: comments
            columns:
              - column:
                  name: comment_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: task_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: text
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false

              - column:
                  name: timestamp
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: is_deleted
                  type: BIT(1)
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: task_id
            referencedTableName: tasks
            referencedColumnNames: task_id
            constraintName: fk_comments_task

        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_comments_user

        - createIndex:
            tableName: comments
            indexName: idx_comments_task_id
            columns:
              - column:
                  name: task_id

        - createIndex:
            tableName: comments
            indexName: idx_comments_user_id
            columns:
              - column:
                  name: user_id
