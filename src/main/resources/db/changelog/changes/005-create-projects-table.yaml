databaseChangeLog:
  - changeSet:
      id: 005-create-projects-table
      author: Ivan
      changes:
        - createTable:
            tableName: projects
            columns:
              - column:
                  name: project_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_projects

              - column:
                  name: name
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(1000)

              - column:
                  name: start_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: end_date
                  type: TIMESTAMP

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: is_deleted
                  type: BIT(1)
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false


        - addForeignKeyConstraint:
            baseTableName: projects
            baseColumnNames: owner_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_projects_owner

        - createIndex:
            tableName: projects
            indexName: idx_projects_owner_id
            columns:
              - column:
                 name: owner_id
