spring.application.name=task-management-spring-app
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.expiration=${JWT_EXPIRATION}
jwt.secret=${JWT_SECRET}

dropbox.app-name=task-management-spring-app
dropbox.access-token=${DROPBOX_ACCESS_TOKEN:}
dropbox.refresh-token=${DROPBOX_REFRESH_TOKEN:}
dropbox.client-id=${DROPBOX_CLIENT_ID:}
dropbox.client-secret=${DROPBOX_CLIENT_SECRET:}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
